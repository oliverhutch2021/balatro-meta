[workspace]
resolver = "2"
members = ["crates/bm-rng", "crates/bm-core", "crates/bm-py"]
# bm-py is the Python extension; build it with maturin (make build), not cargo test.
default-members = ["crates/bm-rng", "crates/bm-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.test]
opt-level = 2
