[package]
name = "bm-py"
description = "Python bindings for the Balatro Meta engine (module balatro_meta._engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py311"] }
rayon = "1.10"
bm-rng = { path = "../bm-rng" }
bm-core = { path = "../bm-core" }
